<style>
:root {
  color-scheme: light;
  --sky: #3f8fea;
  --lime: #dcff3c;
  --shadow: rgba(10, 50, 90, .45);
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--sky); color: var(--lime); font-family: var(--font); -webkit-font-smoothing: antialiased; }
canvas#garden { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }

#bgimg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: .85; pointer-events: none; mix-blend-mode: soft-light; transition: opacity .3s; }
.poster {
  position: fixed; inset: 0; pointer-events: none;
  padding-inline: clamp(16px, 4vw, 40px);
  padding-block: calc(clamp(14px, 3vh, 28px) + env(safe-area-inset-top, 0px)) calc(clamp(16px, 3vh, 30px) + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-rows: auto 1fr auto;
  text-shadow: 0 2px 14px var(--shadow);
}
.poster > * { opacity: 0; transform: translateY(14px); transition: opacity .8s ease, transform .8s ease; }
.poster.go > * { opacity: 1; transform: none; }
.poster.go > .head { transition-delay: .15s; }
.poster.go > .foot { transition-delay: .3s; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; font-size: clamp(.66rem, 1.8vw, .82rem); letter-spacing: .14em; text-transform: uppercase; }
.bar button { pointer-events: auto; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--lime); background: none; border: 1.5px solid var(--lime); border-radius: 999px; padding: 8px 14px; min-height: 36px; cursor: pointer; text-shadow: inherit; }
.bar button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.head { position: relative; margin-top: clamp(14px, 3vh, 34px); }
h1 { margin: 0; font-weight: 900; line-height: 1.04; letter-spacing: -.01em; font-size: clamp(2rem, 8vw, 4.2rem); text-wrap: balance; max-width: 11ch; }
.dot { display: inline-block; width: .32em; height: .32em; border-radius: 50%; background: var(--lime); margin-left: .18em; vertical-align: .12em; }
.big-date { position: absolute; right: 0; top: 0; font-weight: 900; font-size: clamp(2.6rem, 11vw, 6.4rem); line-height: .9; color: #fff; letter-spacing: -.03em; }

.swirl { position: absolute; right: -2%; top: clamp(70px, 14vh, 150px); width: min(62vw, 520px); height: auto; overflow: visible; }
.swirl path { fill: none; stroke: var(--lime); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; filter: drop-shadow(0 2px 6px rgba(10,50,90,.35)); }
.go .swirl path { animation: draw 3.2s .5s ease forwards; }
.swirl text { fill: var(--lime); font: 800 19px var(--font); letter-spacing: .12em; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.foot { display: grid; gap: clamp(8px, 1.6vh, 14px); align-self: end; }
.foot-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.tagline { margin: 0; font-weight: 900; line-height: 1.02; font-size: clamp(2rem, 8vw, 4.2rem); letter-spacing: -.01em; }
.tagline .paren { font-weight: 500; }
.wish { margin: 0; max-width: 36ch; color: #fff; font-weight: 600; font-size: clamp(.92rem, 2.6vw, 1.1rem); line-height: 1.55; text-shadow: 0 1px 3px rgba(10,50,40,.7), 0 2px 16px rgba(10,50,40,.55); }
.poster::before { content: ""; position: fixed; inset: auto 0 0 0; height: 48%; z-index: -1; background: linear-gradient(to top, rgba(10,50,40,.55), rgba(10,50,40,0)); opacity: 0; transition: opacity 1s ease; }
.poster.go::before { opacity: 1; }
.tagline { text-shadow: 0 2px 4px rgba(10,50,40,.55), 0 4px 22px rgba(10,50,40,.6); }
.meta { margin-left: auto; color: #fff; font-weight: 700; font-size: clamp(.66rem, 1.8vw, .82rem); letter-spacing: .14em; text-transform: uppercase; text-align: right; }

.btns { display: flex; gap: 8px; }

@media (prefers-reduced-motion: reduce) {
  .poster > * { transition: none; }
  .go .swirl path { animation: none; stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<canvas id="garden" role="img" aria-label="Khu vườn đầy hoa pastel dưới bầu trời xanh. Chạm vào để hoa mọc thêm."></canvas>

<img id="bgimg" alt="" aria-hidden="true" src="cam-ky-thi-hoa.webp">

<main class="poster" id="poster">
  <div class="bar">
    <span id="t-top">Mừng ngày phụ nữ việt nam</span>
    <div class="btns">
      <button id="replay" type="button">Nở lại ↻</button>
    </div>
  </div>

  <div class="head">
    <h1><span id="t-title">Chúc các quý cô luôn vui vẻ và hạnh phúc</span><span class="dot"></span></h1>
    <div class="big-date" id="t-date">20/10</div>
    <svg class="swirl" viewBox="0 0 520 260" aria-hidden="true">
      <path d="M10 220 C 120 250, 200 140, 130 110 C 60 85, 40 190, 150 200 C 280 212, 330 60, 440 50"/>
      <text x="190" y="30" id="t-swirl"></text>
    </svg>
  </div>

  <div class="foot">
    <div class="foot-row">
      <p class="tagline"><span id="t-tag1">Tài sắc vẹn toàn</span><br><span id="t-tag2">Cầm kỳ thi hoạ</span> <span class="paren" id="t-tag3"></span></p>
      <div class="meta"><span id="t-meta1"></span><br><span id="t-meta2">Ấn vào khoảng trống bất kỳ để hoa nở</span></div>
    </div>
    <p class="wish" id="t-wish">Chào đón các quý cô Content IT đến với đại tiệc CẦM KỲ THI HOẠ lúc 17h15 tại vương quốc NICE VIP Kingdom 28 Khổng Tử, Thủ Đức</p>
  </div>
</main>


<script>
(() => {
  const canvas = document.getElementById("garden");
  const ctx = canvas.getContext("2d");
  const poster = document.getElementById("poster");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // [gần tâm, đầu cánh]
  const PALS = [
    ["#f59a74", "#ffe2cf"], ["#f28fb3", "#ffe3ee"], ["#b49be0", "#efe6ff"], ["#f3c14f", "#fff5cc"],
    ["#d9c6dd", "#ffffff"], ["#8fb7ef", "#e5f0ff"], ["#86d1b6", "#e3f9ef"], ["#e88bd2", "#fde6f7"],
    ["#f58d8d", "#ffe3df"], ["#f7b37e", "#fff0d9"]
  ];
  // rings: n = số cánh, len/wid = tỉ lệ so với bán kính, lift = độ nâng của vòng trong
  const TYPES = {
    gerbera:    { rings: [{ n: 22, len: 1, wid: .12 }, { n: 18, len: .72, wid: .1, deep: .35 }], center: [.26, "#5b3b1f", "#d9a03c"] },
    cosmos:     { rings: [{ n: 8, len: 1, wid: .34, notch: 1 }], center: [.17, "#e3a01e", "#ffe57d"] },
    ranunculus: { rings: [{ n: 11, len: 1, wid: .42 }, { n: 10, len: .8, wid: .4, deep: .2 }, { n: 9, len: .58, wid: .36, deep: .4 }, { n: 7, len: .36, wid: .3, deep: .6 }], center: [.1, "#7a9a3a", "#cfe27a"] },
    daisy:      { rings: [{ n: 26, len: 1, wid: .085 }], center: [.23, "#e8a515", "#ffe46b"] }
  };
  const KEYS = Object.keys(TYPES);
  const GREENS = ["#4f9b45", "#5fae4f", "#6dbb5a", "#3f8a3c", "#7cc766"];

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = t => Math.max(0, Math.min(1, t));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const mk = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });
  const ctx2 = (cv, dpr) => { const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); return c; };

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const f = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
    return `rgb(${f(16)},${f(8)},${f(0)})`;
  }

  let W, H, DPR, k, hz, bg, grass, baked, flowers, extras, drift, start, revealed, lastS = 0;
  const END = 3.3, RATE = 4;

  function build() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    k = Math.max(.8, Math.min(W / 420, H / 720, 2.2));
    hz = H * (W < H ? .56 : .5);

    bg = mk(canvas.width, canvas.height);
    baked = mk(canvas.width, canvas.height);
    paintBackground(ctx2(bg, DPR));
    grass = paintGrass();

    flowers = []; extras = []; drift = []; revealed = false;
    const add = (layer, n, o) => { for (let i = 0; i < n; i++) flowers.push(makeFlower(layer, o())); };
    add(0, Math.ceil(W / 7), () => ({ x: rand(-10, W + 10), gy: hz + rand(-2, H * .06), R: rand(7, 12) * k, h: rand(8, 26) * k, delay: rand(0, .5) }));
    add(1, Math.ceil(W / 8), () => ({ x: rand(-20, W + 20), gy: hz + rand(H * .05, H * .2), R: rand(15, 24) * k, h: rand(30, 90) * k, delay: rand(.05, .6) }));
    add(2, Math.ceil(W / 11) + 8, () => ({ x: rand(-30, W + 30), gy: rand(hz + H * .2, H * 1.08), R: rand(28, 50) * k, h: rand(40, 220) * k, delay: rand(.1, .7) }));
    for (let i = 0; i < 8; i++) { // hoa to hai bên, giữ giữa màn hình dễ đọc
      const left = i % 2 === 0;
      flowers.push(makeFlower(3, { x: left ? rand(-W * .06, W * .18) : rand(W * .82, W * 1.06), gy: H * rand(1, 1.08), R: rand(80, 125) * k, h: rand(H * .18, H * .4), delay: rand(.2, .7) }));
    }
    flowers.sort((a, b) => a.layer - b.layer || a.gy - b.gy);
  }

  function makeFlower(layer, o) {
    return {
      layer, type: pick(KEYS), pal: pick(PALS), x: o.x, gy: o.gy, R: o.R, h: o.h,
      bend: rand(-.35, .35) * o.h, tilt: rand(.42, .72), rot: rand(0, 6.28), lean: rand(-.25, .25),
      delay: o.delay, grow: rand(.7, 1), bloom: rand(1.1, 1.5), leaf: rand(.15, .45), side: Math.random() < .5 ? -1 : 1, born: 0
    };
  }

  function blade(c, x, y, l, w, lean, col) {
    c.beginPath(); c.moveTo(x - w, y);
    c.quadraticCurveTo(x + lean * .4 - w * .3, y - l * .55, x + lean, y - l);
    c.quadraticCurveTo(x + lean * .4 + w * .3, y - l * .55, x + w, y);
    c.fillStyle = col; c.fill();
  }

  function hill(c, y, amp, cols, freq) {
    const g = c.createLinearGradient(0, y - amp, 0, H);
    g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
    const ph = rand(0, 6.28);
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) c.lineTo(x, y - Math.sin(x / W * Math.PI * freq + ph) * amp - amp * .5);
    c.lineTo(W, H); c.fillStyle = g; c.fill();
  }

  function paintBackground(c) {
    const sky = c.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, "#2f7fe3"); sky.addColorStop(.55, "#69b0f5"); sky.addColorStop(1, "#cfeaff");
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    const sun = c.createRadialGradient(W * .82, H * .1, 0, W * .82, H * .1, Math.max(W, H) * .55);
    sun.addColorStop(0, "rgba(255,255,255,.85)"); sun.addColorStop(.12, "rgba(255,255,240,.35)"); sun.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = sun; c.fillRect(0, 0, W, H);
    c.save(); c.filter = `blur(${18 * k}px)`; c.fillStyle = "rgba(255,255,255,.55)";
    for (let i = 0; i < 6; i++) { c.beginPath(); c.ellipse(rand(0, W), rand(hz * .45, hz * .9), rand(80, 200) * k, rand(16, 34) * k, 0, 0, 6.28); c.fill(); }
    c.restore();
    hill(c, hz - 18 * k, 26 * k, ["#b9e59c", "#8fcf6f"], .6);
    hill(c, hz, 14 * k, ["#86cc5f", "#3f9440"], 1.3);
    c.save(); c.globalAlpha = .55;
    for (let i = 0; i < W * 1.4; i++) blade(c, rand(0, W), rand(hz, hz + H * .12), rand(3, 8) * k, rand(.6, 1.2), rand(-3, 3), pick(GREENS));
    c.restore();
  }

  // 3 lớp cỏ: xa, gần, và lớp mờ phía trước
  function paintGrass() {
    const spec = [
      { y0: hz + H * .06, y1: hz + H * .22, n: W * .9, l: [6, 16], w: [.8, 1.6] },
      { y0: hz + H * .2, y1: H + 10, n: W * 1.1, l: [14, 40], w: [1.2, 2.6] },
      { y0: H * .92, y1: H + 30, n: W * .12, l: [60, 170], w: [3, 7], blur: 6 }
    ];
    return spec.map(s => {
      const cv = mk(canvas.width, canvas.height), c = ctx2(cv, DPR);
      for (let j = 0; j < s.n; j++) {
        const y = rand(s.y0, s.y1), shade = clamp((y - hz) / (H - hz));
        blade(c, rand(-10, W + 10), y, rand(...s.l) * k, rand(...s.w) * k, rand(-6, 6) * k, mix("#8fd56f", "#3d8a3a", Math.min(1, shade * .8 + rand(0, .2))));
      }
      if (!s.blur) return cv;
      const out = mk(cv.width, cv.height), oc = out.getContext("2d");
      oc.filter = `blur(${s.blur * k * DPR}px)`; oc.drawImage(cv, 0, 0);
      return out;
    });
  }

  function petal(c, len, wid, notch) {
    c.beginPath(); c.moveTo(0, 0);
    c.bezierCurveTo(len * .22, -wid, len * .82, -wid * .95, len, notch ? -wid * .3 : 0);
    if (notch) { c.lineTo(len * .9, 0); c.lineTo(len, wid * .3); }
    c.bezierCurveTo(len * .82, wid * .95, len * .22, wid, 0, 0);
    c.closePath();
  }

  function drawFlower(c, f, t) {
    t -= f.delay;
    if (t <= 0) return;
    const g = easeOut(clamp(t / f.grow));
    const hx = f.x + f.bend * g, hy = f.gy - f.h * g;
    // thân
    c.lineCap = "round"; c.strokeStyle = "#4f9b45"; c.lineWidth = Math.max(1.2, f.R * .07);
    c.beginPath(); c.moveTo(f.x, f.gy); c.quadraticCurveTo(f.x, f.gy - f.h * g * .55, hx, hy); c.stroke();
    // lá
    if (g > .4) {
      const lt = (g - .4) / .6, ly = f.gy - f.h * f.leaf * g, lx = f.x + f.bend * f.leaf * f.leaf * g;
      const ll = f.R * .8 * lt;
      c.save(); c.translate(lx, ly); c.rotate(f.side * -.7);
      c.fillStyle = "#5fae4f"; petal(c, ll * f.side, ll * .28, false); c.fill(); c.restore();
    }
    // đầu hoa
    const p = clamp((t - f.grow * .7) / f.bloom);
    const T = TYPES[f.type], R = f.R, e = p < 1 ? easeBack(p) : 1;
    c.save(); c.translate(hx, hy); c.rotate(f.lean);
    if (p < .35) { // nụ
      const b = 1 - p / .35;
      c.globalAlpha = b; c.fillStyle = "#5aa64a";
      c.beginPath(); c.ellipse(0, 0, R * .18 * (.5 + b * .5), R * .26 * (.5 + b * .5), 0, 0, 6.28); c.fill();
      c.globalAlpha = 1;
    }
    if (p > 0) {
      c.save(); c.scale(1, f.tilt + (1 - f.tilt) * (1 - p) * .5);
      T.rings.forEach((ring, ri) => {
        const len = R * ring.len * (.12 + .88 * e), wid = R * ring.wid * (.4 + .6 * e);
        const col = mix(f.pal[0], f.pal[1], 1 - (ring.deep || 0));
        for (let i = 0; i < ring.n; i++) {
          c.save(); c.rotate(f.rot + (i / ring.n) * 6.283 + ri * .35);
          c.translate(R * .08, 0);
          const gr = c.createLinearGradient(0, 0, len, 0);
          gr.addColorStop(0, f.pal[0]); gr.addColorStop(.35, col); gr.addColorStop(1, f.pal[1]);
          c.fillStyle = gr; petal(c, len, wid, ring.notch); c.fill();
          c.restore();
        }
      });
      const [cr, c0, c1] = T.center, rr = R * cr * (.4 + .6 * e);
      const cg = c.createRadialGradient(0, 0, 0, 0, 0, rr);
      cg.addColorStop(0, c0); cg.addColorStop(1, c1);
      c.fillStyle = cg; c.beginPath(); c.arc(0, 0, rr, 0, 6.283); c.fill();
      c.restore();
    }
    c.restore();
  }

  function compose(t, c) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(bg, 0, 0);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lay = l => { for (const f of flowers) if (f.layer === l) drawFlower(c, f, t); };
    const gr = i => { c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(grass[i], 0, 0); c.setTransform(DPR, 0, 0, DPR, 0, 0); };
    lay(0); lay(1); gr(0); gr(1); lay(2); lay(3); gr(2);
  }

  function spawnDrift() {
    drift.push({ x: rand(0, W), y: H + 10, r: rand(6, 26) * k, a: rand(.08, .22), vy: rand(-.5, -.15), vx: rand(-.2, .2) });
  }
  function ambient() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const d of drift) {
      d.x += d.vx; d.y += d.vy;
      ctx.fillStyle = `rgba(255,255,255,${d.a})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
    }
    drift = drift.filter(d => d.y > -40);
  }

  function sprout(born) {
    const near = Math.random() < .55;
    const f = near
      ? makeFlower(2, { x: rand(-20, W + 20), gy: rand(hz + H * .22, H * 1.05), R: rand(28, 50) * k, h: rand(40, 200) * k, delay: 0 })
      : makeFlower(1, { x: rand(-20, W + 20), gy: hz + rand(H * .05, H * .2), R: rand(15, 24) * k, h: rand(30, 90) * k, delay: 0 });
    f.born = born; extras.push(f);
  }

  let isBaked = false;
  function frame(now) {
    const t = (now - start) / 1000;
    if (!isBaked) {
      compose(t, ctx);
      if (t > END) { compose(99, baked.getContext("2d")); isBaked = true; }
    } else {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(baked, 0, 0);
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const s = now / 1000;
    if (isBaked) {
      const dt = Math.min(.1, s - (lastS || s)); lastS = s;
      if (Math.random() < dt * RATE) sprout(s);
    }
    for (const f of extras) drawFlower(ctx, f, s - f.born);
    if (isBaked) { // hoa nở xong thì ép vào ảnh nền cho nhẹ
      const done = extras.filter(f => s - f.born > f.delay + f.grow * .7 + f.bloom + .1);
      if (done.length) {
        const bc = baked.getContext("2d"); bc.setTransform(DPR, 0, 0, DPR, 0, 0);
        for (const f of done) drawFlower(bc, f, 99);
        extras = extras.filter(f => !done.includes(f));
      }
    }
    if (t > END - 1) { if (drift.length < Math.min(40, W / 18) && Math.random() < .12) spawnDrift(); ambient(); }
    if (!revealed && t > END - .9) { revealed = true; poster.classList.add("go"); }
    requestAnimationFrame(frame);
  }

  function bloom() {
    poster.classList.remove("go");
    isBaked = false; build();
    start = performance.now() - (reduce ? 99000 : 0);
  }

  canvas.addEventListener("pointerdown", e => {
    const born = performance.now() / 1000;
    for (let i = 0; i < 3; i++) {
      const f = makeFlower(2, { x: e.clientX + rand(-30, 30) * k, gy: H + 20, R: rand(30, 46) * k, h: 0, delay: i * .12 });
      f.h = H + 20 - e.clientY + rand(-30, 30) * k; f.bend = rand(-.12, .12) * f.h; f.grow = .6; f.born = born;
      extras.push(f);
    }
    if (extras.length > 120) extras.splice(0, extras.length - 120);
  });
  document.getElementById("replay").addEventListener("click", bloom);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(bloom, 250); });

  bloom();
  requestAnimationFrame(frame);

})();
</script>
